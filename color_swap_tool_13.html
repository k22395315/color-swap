<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皮小姐衣櫃｜商品換色工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf9f7; --surface: #ffffff; --surface2: #f4f2ef;
    --border: #e8e4de; --border2: #d5cfc7;
    --text: #1a1816; --text2: #6b6560; --text3: #9e9790;
    --accent: #c4956a; --accent-light: #f5ede3; --accent-dark: #9a6e47;
    --success: #4a7c59; --success-light: #e8f4ec;
    --danger: #b54a4a; --danger-light: #fbeaea;
    --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 12px; }
  .logo-mark { width: 36px; height: 36px; background: var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-mark span { color: #fff; font-size: 14px; font-weight: 700; }
  .logo-text .brand { font-size: 15px; font-weight: 700; }
  .logo-text .sub { font-size: 11px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
  .main { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }
  .page-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .page-desc { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.6; }
  .apikey-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .apikey-card label { font-size: 13px; font-weight: 500; color: var(--text2); white-space: nowrap; }
  .apikey-card input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: monospace; background: var(--surface2); color: var(--text); }
  .apikey-card input:focus { outline: none; border-color: var(--accent); }
  .apikey-save-btn { padding: 8px 16px; background: var(--text); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; cursor: pointer; }
  .apikey-save-btn:hover { background: #2d2a26; }
  .apikey-status { font-size: 12px; width: 100%; }
  .apikey-status.ok { color: var(--success); }
  .apikey-status.empty { color: var(--danger); }
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } .main { padding: 20px 16px 48px; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-label { font-size: 12px; font-weight: 500; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card-label .step-num { width: 20px; height: 20px; background: var(--text); color: #fff; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0; }
  .upload-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius-sm); background: var(--surface2); min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; overflow: hidden; text-align: center; padding: 20px; }
  .upload-zone:hover { border-color: var(--accent); background: var(--accent-light); }
  .upload-zone.has-image { border-style: solid; border-color: var(--border); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-zone .up-icon { font-size: 28px; opacity: 0.3; }
  .upload-zone .up-text { font-size: 13px; color: var(--text2); }
  .upload-zone .up-hint { font-size: 11px; color: var(--text3); }
  .upload-zone img.thumb { max-height: 160px; max-width: 100%; object-fit: contain; border-radius: var(--radius-sm); display: none; }
  .upload-zone.has-image img.thumb { display: block; }
  .upload-zone.has-image .up-icon, .upload-zone.has-image .up-text, .upload-zone.has-image .up-hint { display: none; }
  .change-btn { margin-top: 8px; font-size: 11px; color: var(--text3); text-align: center; cursor: pointer; display: none; }
  .change-btn:hover { color: var(--accent); }
  .color-preview { margin-top: 12px; padding: 10px 14px; background: var(--surface2); border-radius: var(--radius-sm); font-size: 12px; color: var(--text2); display: none; align-items: center; gap: 10px; }
  .color-preview.visible { display: flex; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border2); flex-shrink: 0; }
  textarea { width: 100%; min-height: 60px; font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; resize: vertical; line-height: 1.6; margin-top: 8px; }
  textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  textarea::placeholder { color: var(--text3); }
  .run-btn { width: 100%; padding: 14px; background: var(--text); color: #fff; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
  .run-btn:hover { background: #2d2a26; }
  .run-btn:disabled { background: var(--border2); cursor: not-allowed; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-bar { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; display: none; line-height: 1.5; }
  .status-bar.loading { background: var(--accent-light); color: var(--accent-dark); display: block; }
  .status-bar.error { background: var(--danger-light); color: var(--danger); display: block; }
  .status-bar.success { background: var(--success-light); color: var(--success); display: block; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-top: 20px; display: none; }
  .result-card.visible { display: block; }
  .result-header { font-size: 13px; font-weight: 500; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
  .result-img-wrap { text-align: center; }
  .result-img-wrap img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--border); }
  .download-btn { width: 100%; margin-top: 16px; padding: 12px; background: var(--success); color: #fff; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .download-btn:hover { background: #3d6b4a; }
</style>
</head>
<body>
<header>
  <div class="logo-mark"><span>皮</span></div>
  <div class="logo-text">
    <div class="brand">皮小姐衣櫃</div>
    <div class="sub">商品換色工具</div>
  </div>
</header>
<div class="main">
  <h1 class="page-title">商品換色工具</h1>
  <p class="page-desc">上傳原始商品圖 + 顏色參考圖 → AI 自動提取顏色 → 直接生成換色後的圖片</p>

  <div class="apikey-card">
    <label>🔑 OpenAI API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-proj-..." autocomplete="off">
    <button class="apikey-save-btn" onclick="saveApiKey()">儲存</button>
    <div class="apikey-status" id="apiKeyStatus"></div>
  </div>

  <div class="tool-grid">
    <div class="card">
      <div class="card-label"><span class="step-num">1</span> 原始商品圖</div>
      <div class="upload-zone" id="origZone">
        <input type="file" accept="image/jpeg,image/png,image/webp" id="origInput">
        <div class="up-icon">📷</div>
        <div class="up-text">點擊上傳原始商品圖</div>
        <div class="up-hint">JPG、PNG、WEBP</div>
        <img class="thumb" id="origThumb" alt="原圖預覽">
      </div>
      <div class="change-btn" id="origChangeBtn" onclick="resetImg('orig')">重新上傳</div>
    </div>
    <div class="card">
      <div class="card-label"><span class="step-num">2</span> 目標顏色參考圖</div>
      <div class="upload-zone" id="colorZone">
        <input type="file" accept="image/jpeg,image/png,image/webp" id="colorInput">
        <div class="up-icon">🎨</div>
        <div class="up-text">上傳目標顏色的商品圖</div>
        <div class="up-hint">AI 會自動提取這張圖的顏色</div>
        <img class="thumb" id="colorThumb" alt="顏色參考圖">
      </div>
      <div class="change-btn" id="colorChangeBtn" onclick="resetImg('color')">重新上傳</div>
      <div class="color-preview" id="colorPreview">
        <div class="color-dot" id="colorDot"></div>
        <span id="colorDesc">分析中...</span>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:0;">
    <div class="card-label"><span class="step-num">3</span> 補充說明（選填）</div>
    <textarea id="extraNote" placeholder="例如：只換上衣顏色，褲子和背景保持不變 / 只換泳衣，保留人物和背景"></textarea>
  </div>

  <button class="run-btn" id="runBtn" onclick="runSwap()">
    <div class="spinner" id="spinner"></div>
    <span id="runLabel">✦ 開始換色出圖</span>
  </button>

  <div class="status-bar" id="statusBar"></div>

  <div class="result-card" id="resultCard">
    <div class="result-header">✓ 換色完成</div>
    <div class="result-img-wrap">
      <img id="resultImg" alt="換色結果">
    </div>
    <button class="download-btn" onclick="downloadResult()">⬇ 下載換色圖片</button>
  </div>
</div>

<script>
let imgs = { orig: null, color: null };
let resultDataUrl = null;

window.addEventListener('load', () => {
  const saved = localStorage.getItem('openai_api_key');
  if (saved) {
    document.getElementById('apiKeyInput').value = saved;
    showKeyStatus('✓ API Key 已載入', 'ok');
  }
});

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { showKeyStatus('請輸入 API Key', 'empty'); return; }
  localStorage.setItem('openai_api_key', key);
  showKeyStatus('✓ 已儲存，下次自動載入', 'ok');
}

function showKeyStatus(msg, cls) {
  const el = document.getElementById('apiKeyStatus');
  el.textContent = msg;
  el.className = 'apikey-status ' + cls;
}

['orig', 'color'].forEach(type => {
  document.getElementById(type + 'Input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      imgs[type] = { b64: ev.target.result.split(',')[1], mime: file.type || 'image/jpeg' };
      document.getElementById(type + 'Thumb').src = ev.target.result;
      document.getElementById(type + 'Zone').classList.add('has-image');
      document.getElementById(type + 'ChangeBtn').style.display = 'block';
      if (type === 'color') {
        document.getElementById('colorPreview').classList.remove('visible');
      }
    };
    reader.readAsDataURL(file);
  });
});

function resetImg(type) {
  imgs[type] = null;
  document.getElementById(type + 'Thumb').src = '';
  document.getElementById(type + 'Zone').classList.remove('has-image');
  document.getElementById(type + 'ChangeBtn').style.display = 'none';
  document.getElementById(type + 'Input').value = '';
  if (type === 'color') {
    document.getElementById('colorPreview').classList.remove('visible');
  }
}

function setStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar ' + type;
}

function toPngBlob(b64, mime, maxSize = 1024) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error('圖片載入失敗，請重新上傳'));
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('圖片轉換失敗'));
      }, 'image/png');
    };
    img.src = 'data:' + mime + ';base64,' + b64;
  });
}

async function runSwap() {
  const apiKey = localStorage.getItem('openai_api_key') || document.getElementById('apiKeyInput').value.trim();
  const extraNote = document.getElementById('extraNote').value.trim();

  if (!apiKey) { setStatus('請先輸入並儲存 OpenAI API Key', 'error'); return; }
  if (!imgs.orig) { setStatus('請上傳原始商品圖', 'error'); return; }
  if (!imgs.color) { setStatus('請上傳目標顏色參考圖', 'error'); return; }

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('runLabel').textContent = '處理中...';
  document.getElementById('resultCard').classList.remove('visible');

  try {
    // Step 1: 用 gpt-4o 分析參考圖顏色，拿到精確 hex + 描述
    setStatus('步驟 1/2：AI 分析參考圖顏色中...', 'loading');

    const colorRes = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: 'gpt-4o-2024-11-20',
        max_tokens: 150,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image_url',
              image_url: { url: 'data:' + imgs.color.mime + ';base64,' + imgs.color.b64 }
            },
            {
              type: 'text',
              text: 'Analyze the main clothing/garment color in this image. Return ONLY a JSON object with these fields: {"hex": "#RRGGBB", "name_en": "color name in English", "name_zh": "顏色中文名稱", "description": "detailed color description in English for image generation, max 20 words"}. No other text.'
            }
          ]
        }]
      })
    });

    const colorData = await colorRes.json();
    if (colorData.error) throw new Error('顏色分析失敗：' + colorData.error.message);

    const rawText = colorData.choices?.[0]?.message?.content?.trim() || '';
    let colorInfo;
    try {
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      colorInfo = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
    } catch(e) {
      colorInfo = { hex: '#888888', name_en: rawText, name_zh: rawText, description: rawText };
    }

    // 顯示提取到的顏色
    document.getElementById('colorDot').style.background = colorInfo.hex || '#888';
    document.getElementById('colorDesc').textContent = (colorInfo.name_zh || '') + ' ' + (colorInfo.hex || '');
    document.getElementById('colorPreview').classList.add('visible');

    // Step 2: 用 gpt-image-2 換色出圖
    setStatus('步驟 2/2：AI 生成換色圖片中，約 30–60 秒...', 'loading');

    const origBlob = await toPngBlob(imgs.orig.b64, imgs.orig.mime);

    const prompt = `Change the clothing color in this image to ${colorInfo.description || colorInfo.name_en} (hex color: ${colorInfo.hex}). Keep everything else exactly the same: the person, pose, face, hair, background, clothing style, fabric texture, shadows, and lighting. Only change the clothing color. Make it look photorealistic.${extraNote ? ' ' + extraNote : ''}`;

    const fd = new FormData();
    fd.append('model', 'gpt-image-2-2026-04-21');
    fd.append('prompt', prompt);
    fd.append('n', '1');
    fd.append('size', '1024x1024');
    fd.append('image', new File([origBlob], 'image.png', { type: 'image/png' }));

    const editRes = await fetch('https://api.openai.com/v1/images/edits', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + apiKey },
      body: fd
    });

    const editData = await editRes.json();
    if (editData.error) throw new Error('換色失敗：' + editData.error.message);

    const imgResult = editData.data?.[0];
    if (!imgResult) throw new Error('沒有收到圖片結果');

    if (imgResult.b64_json) {
      resultDataUrl = 'data:image/png;base64,' + imgResult.b64_json;
    } else if (imgResult.url) {
      resultDataUrl = imgResult.url;
    } else {
      throw new Error('圖片格式不符');
    }

    document.getElementById('resultImg').src = resultDataUrl;
    document.getElementById('resultCard').classList.add('visible');
    setStatus('✓ 換色完成！可以下載了', 'success');

  } catch (err) {
    setStatus('錯誤：' + err.message, 'error');
  }

  btn.disabled = false;
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('runLabel').textContent = '✦ 重新換色';
}

function downloadResult() {
  if (!resultDataUrl) return;
  if (resultDataUrl.startsWith('http')) {
    window.open(resultDataUrl, '_blank');
    return;
  }
  const a = document.createElement('a');
  a.href = resultDataUrl;
  a.download = 'color_swap_result.png';
  a.click();
}
</script>
</body>
</html>
