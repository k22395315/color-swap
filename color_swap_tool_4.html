<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皮小姐衣櫃｜商品換色工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf9f7; --surface: #ffffff; --surface2: #f4f2ef;
    --border: #e8e4de; --border2: #d5cfc7;
    --text: #1a1816; --text2: #6b6560; --text3: #9e9790;
    --accent: #c4956a; --accent-light: #f5ede3; --accent-dark: #9a6e47;
    --success: #4a7c59; --success-light: #e8f4ec;
    --danger: #b54a4a; --danger-light: #fbeaea;
    --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 12px; }
  .logo-mark { width: 36px; height: 36px; background: var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-mark span { color: #fff; font-size: 14px; font-weight: 700; }
  .logo-text .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  .logo-text .sub { font-size: 11px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
  .main { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }
  .page-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
  .page-desc { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.6; }

  /* API Key 區塊 */
  .apikey-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .apikey-card label { font-size: 13px; font-weight: 500; color: var(--text2); white-space: nowrap; }
  .apikey-card input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: monospace; background: var(--surface2); color: var(--text); }
  .apikey-card input:focus { outline: none; border-color: var(--accent); }
  .apikey-save-btn { padding: 8px 16px; background: var(--text); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .apikey-save-btn:hover { background: #2d2a26; }
  .apikey-status { font-size: 12px; width: 100%; }
  .apikey-status.ok { color: var(--success); }
  .apikey-status.empty { color: var(--danger); }

  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } .main { padding: 20px 16px 48px; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-label { font-size: 12px; font-weight: 500; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card-label .step-num { width: 20px; height: 20px; background: var(--text); color: #fff; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0; }
  .upload-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius-sm); background: var(--surface2); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; overflow: hidden; text-align: center; padding: 20px; }
  .upload-zone:hover { border-color: var(--accent); background: var(--accent-light); }
  .upload-zone.has-image { border-style: solid; border-color: var(--border); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-zone .up-icon { font-size: 32px; opacity: 0.3; }
  .upload-zone .up-text { font-size: 13px; color: var(--text2); }
  .upload-zone .up-hint { font-size: 11px; color: var(--text3); }
  .upload-zone img.thumb { max-height: 180px; max-width: 100%; object-fit: contain; border-radius: var(--radius-sm); display: none; }
  .upload-zone.has-image img.thumb { display: block; }
  .upload-zone.has-image .up-icon, .upload-zone.has-image .up-text, .upload-zone.has-image .up-hint { display: none; }
  .change-btn { margin-top: 8px; font-size: 11px; color: var(--text3); text-align: center; cursor: pointer; display: none; }
  .change-btn:hover { color: var(--accent); }
  .color-section { margin-top: 16px; }
  .color-section-title { font-size: 12px; color: var(--text2); margin-bottom: 10px; font-weight: 500; }
  .color-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: var(--accent); transform: scale(1.15); box-shadow: 0 0 0 3px var(--accent-light); }
  .divider { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: var(--text3); font-size: 11px; letter-spacing: 1px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .color-ref-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius-sm); background: var(--surface2); min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative; overflow: hidden; padding: 12px; }
  .color-ref-zone:hover { border-color: var(--accent); background: var(--accent-light); }
  .color-ref-zone.has-image { border-style: solid; border-color: var(--border); }
  .color-ref-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .color-ref-zone img.thumb { max-height: 60px; max-width: 100%; object-fit: contain; display: none; border-radius: 4px; }
  .color-ref-zone.has-image img.thumb { display: block; }
  .color-ref-zone.has-image .up-icon, .color-ref-zone.has-image .up-text { display: none; }
  textarea { width: 100%; min-height: 72px; font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; resize: vertical; transition: border-color 0.2s; line-height: 1.6; margin-top: 8px; }
  textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  textarea::placeholder { color: var(--text3); }
  .run-btn { width: 100%; padding: 14px; background: var(--text); color: #fff; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; letter-spacing: 0.5px; }
  .run-btn:hover { background: #2d2a26; }
  .run-btn:active { transform: scale(0.99); }
  .run-btn:disabled { background: var(--border2); cursor: not-allowed; transform: none; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-bar { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; display: none; line-height: 1.5; }
  .status-bar.loading { background: var(--accent-light); color: var(--accent-dark); display: block; }
  .status-bar.error { background: var(--danger-light); color: var(--danger); display: block; }
  .status-bar.success { background: var(--success-light); color: var(--success); display: block; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-top: 20px; display: none; }
  .result-card.visible { display: block; }
  .result-header { font-size: 13px; font-weight: 500; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .result-content { font-size: 14px; line-height: 1.8; color: var(--text); white-space: pre-wrap; background: var(--surface2); border-radius: var(--radius-sm); padding: 16px; border: 1px solid var(--border); }
  .next-step-box { margin-top: 16px; background: var(--accent-light); border: 1px solid #e8c9a8; border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13px; color: var(--accent-dark); line-height: 1.7; }
  .next-step-box strong { font-weight: 700; display: block; margin-bottom: 4px; }
  .copy-btn { margin-top: 12px; padding: 9px 16px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text); transition: background 0.15s; display: flex; align-items: center; gap: 6px; }
  .copy-btn:hover { background: var(--surface2); }
  .copy-btn.copied { color: var(--success); border-color: var(--success); }
  .firefly-link { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; background: var(--text); color: #fff; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; text-decoration: none; transition: background 0.15s; }
  .firefly-link:hover { background: #2d2a26; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .selected-color-badge { display: none; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text2); margin-top: 8px; }
  .selected-color-badge.visible { display: inline-flex; }
  .selected-color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
</style>
</head>
<body>
<header>
  <div class="logo-mark"><span>皮</span></div>
  <div class="logo-text">
    <div class="brand">皮小姐衣櫃</div>
    <div class="sub">商品換色工具</div>
  </div>
</header>
<div class="main">
  <h1 class="page-title">商品換色工具</h1>
  <p class="page-desc">上傳原始商品圖 → 選擇目標顏色 → AI 分析換色方案 → 貼到 Adobe Firefly 生成成品圖</p>

  <!-- API Key 輸入 -->
  <div class="apikey-card">
    <label>🔑 OpenAI API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-proj-..." autocomplete="off">
    <button class="apikey-save-btn" onclick="saveApiKey()">儲存</button>
    <div class="apikey-status" id="apiKeyStatus"></div>
  </div>

  <div class="tool-grid">
    <div class="card">
      <div class="card-label"><span class="step-num">1</span> 原始商品圖</div>
      <div class="upload-zone" id="origZone">
        <input type="file" accept="image/*" id="origInput">
        <div class="up-icon">📷</div>
        <div class="up-text">點擊上傳原始商品圖</div>
        <div class="up-hint">支援 JPG、PNG、WEBP</div>
        <img class="thumb" id="origThumb" alt="原圖預覽">
      </div>
      <div class="change-btn" id="origChangeBtn" onclick="resetOrig()">重新上傳</div>
    </div>
    <div class="card">
      <div class="card-label"><span class="step-num">2</span> 目標顏色</div>
      <div class="color-section">
        <div class="color-section-title">快速選色</div>
        <div class="color-swatches" id="swatches">
          <div class="swatch" data-name="黑色" data-en="black" style="background:#1a1a1a" title="黑色"></div>
          <div class="swatch" data-name="白色" data-en="white" style="background:#f5f5f3; border-color:#ddd" title="白色"></div>
          <div class="swatch" data-name="霧粉色" data-en="dusty rose pink" style="background:#d4a0a0" title="霧粉色"></div>
          <div class="swatch" data-name="杏色" data-en="warm apricot beige" style="background:#e8c9a8" title="杏色"></div>
          <div class="swatch" data-name="鼠尾草綠" data-en="sage green" style="background:#8fad91" title="鼠尾草綠"></div>
          <div class="swatch" data-name="天空藍" data-en="sky blue" style="background:#87b5d4" title="天空藍"></div>
          <div class="swatch" data-name="深海藍" data-en="deep navy blue" style="background:#2c3e6b" title="深海藍"></div>
          <div class="swatch" data-name="駝色" data-en="camel brown" style="background:#c4956a" title="駝色"></div>
          <div class="swatch" data-name="酒紅色" data-en="deep burgundy wine red" style="background:#7d2d3a" title="酒紅色"></div>
          <div class="swatch" data-name="薰衣草紫" data-en="soft lavender purple" style="background:#b59dd4" title="薰衣草紫"></div>
          <div class="swatch" data-name="珊瑚橘" data-en="warm coral orange" style="background:#e07a5f" title="珊瑚橘"></div>
          <div class="swatch" data-name="炭灰色" data-en="charcoal gray" style="background:#5a5a5a" title="炭灰色"></div>
        </div>
        <div id="selectedBadge" class="selected-color-badge">
          <div class="selected-color-dot" id="badgeDot"></div>
          <span id="badgeText">未選擇</span>
        </div>
      </div>
      <div class="divider">或上傳參考圖</div>
      <div class="color-ref-zone" id="colorRefZone">
        <input type="file" accept="image/*" id="colorRefInput">
        <div class="up-icon" style="font-size:22px; opacity:0.3;">🎨</div>
        <div class="up-text" style="font-size:12px; color:var(--text2);">上傳目標顏色參考圖</div>
        <img class="thumb" id="colorRefThumb" alt="顏色參考圖">
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 0;">
    <div class="card-label"><span class="step-num">3</span> 補充說明（選填）</div>
    <textarea id="extraNote" placeholder="例如：保留蕾絲花紋，只換底色 / 整件改成純白版本 / 保留提臀設計，顏色換成霧粉色"></textarea>
  </div>

  <button class="run-btn" id="runBtn" onclick="runSwap()">
    <div class="spinner" id="spinner"></div>
    <span id="runLabel">✦ 開始換色分析</span>
  </button>

  <div class="status-bar" id="statusBar"></div>

  <div class="result-card" id="resultCard">
    <div class="result-header">✓ 換色方案完成</div>
    <div class="result-content" id="resultContent"></div>
    <div class="next-step-box">
      <strong>下一步：貼到 Adobe Firefly 生成實際換色圖片</strong>
      複製上方的換色描述 → 開啟 Adobe Firefly → 上傳原圖 → 使用「Generative Fill」功能 → 貼入描述 → 生成下載
    </div>
    <div class="btn-row" style="margin-top: 12px;">
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">📋 複製換色描述</button>
      <a class="firefly-link" href="https://firefly.adobe.com" target="_blank">開啟 Adobe Firefly →</a>
    </div>
  </div>
</div>

<script>
let origBase64 = null, colorRefBase64 = null, selectedColorName = null, selectedColorEn = null, resultText = '';

// 載入已存的 API Key
window.addEventListener('load', () => {
  const saved = localStorage.getItem('openai_api_key');
  if (saved) {
    document.getElementById('apiKeyInput').value = saved;
    document.getElementById('apiKeyStatus').textContent = '✓ API Key 已載入';
    document.getElementById('apiKeyStatus').className = 'apikey-status ok';
  }
});

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    document.getElementById('apiKeyStatus').textContent = '請輸入 API Key';
    document.getElementById('apiKeyStatus').className = 'apikey-status empty';
    return;
  }
  localStorage.setItem('openai_api_key', key);
  document.getElementById('apiKeyStatus').textContent = '✓ 已儲存，下次自動載入';
  document.getElementById('apiKeyStatus').className = 'apikey-status ok';
}

document.getElementById('origInput').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    origBase64 = ev.target.result.split(',')[1];
    document.getElementById('origThumb').src = ev.target.result;
    document.getElementById('origZone').classList.add('has-image');
    document.getElementById('origChangeBtn').style.display = 'block';
  };
  reader.readAsDataURL(file);
});

document.getElementById('colorRefInput').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    colorRefBase64 = ev.target.result.split(',')[1];
    document.getElementById('colorRefThumb').src = ev.target.result;
    document.getElementById('colorRefZone').classList.add('has-image');
    selectedColorName = null; selectedColorEn = null;
    clearSwatches();
    document.getElementById('selectedBadge').classList.remove('visible');
  };
  reader.readAsDataURL(file);
});

document.querySelectorAll('.swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    clearSwatches(); swatch.classList.add('active');
    selectedColorName = swatch.dataset.name; selectedColorEn = swatch.dataset.en;
    colorRefBase64 = null;
    document.getElementById('colorRefZone').classList.remove('has-image');
    document.getElementById('colorRefThumb').src = '';
    const badge = document.getElementById('selectedBadge');
    badge.classList.add('visible');
    document.getElementById('badgeDot').style.background = swatch.style.background;
    document.getElementById('badgeText').textContent = selectedColorName;
  });
});

function clearSwatches() { document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active')); }
function resetOrig() {
  origBase64 = null;
  document.getElementById('origThumb').src = '';
  document.getElementById('origZone').classList.remove('has-image');
  document.getElementById('origChangeBtn').style.display = 'none';
  document.getElementById('origInput').value = '';
}
function setStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg; bar.className = 'status-bar ' + type;
}

async function runSwap() {
  const apiKey = localStorage.getItem('openai_api_key') || document.getElementById('apiKeyInput').value.trim();
  if (!apiKey) { setStatus('請先輸入並儲存 OpenAI API Key', 'error'); return; }
  if (!origBase64) { setStatus('請先上傳原始商品圖', 'error'); return; }
  if (!selectedColorEn && !colorRefBase64) { setStatus('請選擇目標顏色或上傳顏色參考圖', 'error'); return; }

  const extra = document.getElementById('extraNote').value.trim();
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('runLabel').textContent = '分析中...';
  document.getElementById('resultCard').classList.remove('visible');
  setStatus('AI 正在分析換色方案，約 10–20 秒...', 'loading');

  try {
    const colorInstruction = selectedColorEn
      ? `目標換色：${selectedColorName}（${selectedColorEn}）`
      : '根據第二張顏色參考圖，提取其主要顏色進行換色';

    const prompt = `你是一位資深的時尚服裝商品圖AI換色專家，專為台灣女性機能服飾電商品牌提供換色方案。

請分析第一張圖（原始商品圖），完成以下工作：

【原圖分析】
- 描述衣服的材質特徵（蕾絲/棉/彈力/透膚感等）
- 描述目前的顏色分布（主色、副色、細節色）
- 描述特殊工藝或圖案（蕾絲花紋、拼接、印花等）

【換色方案】
${colorInstruction}
${extra ? `特別要求：${extra}` : ''}

請輸出以下格式：
1. Firefly Prompt（英文，可直接貼入Adobe Firefly的換色指令，100字以內）
2. 換色說明（中文，說明哪些部位換色、效果如何、材質紋理如何保留）
3. 注意事項（貼入Firefly後應注意的細節）

格式範例：
─────────────────
【Firefly Prompt】
Change the color of the garment to [color], maintain the lace texture and pattern details, preserve fabric sheen and shadows, photorealistic product photography style

【換色說明】
...

【注意事項】
...
─────────────────`;

    const imageContents = [];
    imageContents.push({ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + origBase64 } });
    if (colorRefBase64) {
      imageContents.push({ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + colorRefBase64 } });
    }
    imageContents.push({ type: 'text', text: prompt });

    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({ model: 'gpt-4o', max_tokens: 1000, messages: [{ role: 'user', content: imageContents }] })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    resultText = data.choices?.[0]?.message?.content || '';

    if (resultText) {
      document.getElementById('resultContent').textContent = resultText;
      document.getElementById('resultCard').classList.add('visible');
      setStatus('✓ 分析完成，請複製 Firefly Prompt 貼入 Adobe Firefly 生成圖片', 'success');
    }
  } catch (err) {
    setStatus('發生錯誤：' + err.message, 'error');
  }
  btn.disabled = false;
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('runLabel').textContent = '✦ 重新分析';
}

function copyResult() {
  if (!resultText) return;
  navigator.clipboard.writeText(resultText).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ 已複製'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 複製換色描述'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
